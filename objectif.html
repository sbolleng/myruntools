<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>
  // Masquée jusqu'à ce qu'elle soit prête. Déjà dans le site (en-tête gardé pour la visite) : seul le contenu attend,
  // l'en-tête et le menu s'affichent aussitôt, sans page blanche entre deux pages.
  (function () { var c = null; try { c = sessionStorage.getItem('mrt-entete'); } catch (e) {} document.documentElement.classList.add(c ? 'mrt-attente-contenu' : 'mrt-attente'); })();
</script>
<title>Objectif · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<link rel="stylesheet" href="composants/objectif.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course.css?v=__VERSION__">
</head>
<body>
<main>
  <div id="feuille-de-route"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script src="composants/objectif.js?v=__VERSION__"></script>
<script src="composants/fiche-course.js?v=__VERSION__"></script>
<script>
  // La feuille de route de l'utilisateur connecté (ou du site partagé), lue dans la base.
  mrtPage({ courant: 'objectif.html' }).then(page => {
    let courses = page.courses;
    const el = document.getElementById('feuille-de-route');
    // Après un enregistrement ou une suppression : relire et redessiner (en-tête compris).
    const apres = async () => { courses = await page.relire(); dessiner(); };
    const edition = mrtEdition(page, () => courses, apres);
    const dessiner = () => renderFeuilleDeRoute(el, courses, edition);
    dessiner();
  });
</script>
</body>
</html>
