<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="site-version" content="__VERSION__">
<title>Palmarès · MyRunTools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="composants/palmares.css?v=__VERSION__">
<style>
  /* Thèmes : route par défaut, trail avec ?t=trail. */
  .t-route { --bg:#0E1D19; --surface:#18332E; --surface2:#21453D; --border:#2F5A4E; --accent:#D07B87; --accent2:#B76E78; --text:#EDF2E9; --muted:#8FA391; --red:#E07A6F; }
  .t-trail { --bg:#060b14; --surface:#122a4a; --surface2:#163a66; --border:#1f4c80; --accent:#ffb700; --accent2:#ffd400; --text:#eef3fa; --muted:#8fa8c9; --red:#ff6b5b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { margin: 0.3rem 0 0.4rem; font-size: 1.8rem; }
  .intro { margin: 0 0 1.4rem; color: var(--muted); font-size: 0.85rem; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; padding: 0.6rem 0.75rem; font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
</style>
</head>
<body class="t-route">
<main>
  <p class="eyebrow">MyRunTools · prototype</p>
  <h1>Palmarès</h1>
  <p class="intro">Jeu de données de test. Valeurs montre dans les colonnes facultatives (bouton « + »).</p>
  <div id="palmares" class="pv2"></div>
</main>
<script>
  if (new URLSearchParams(location.search).get('t') === 'trail') document.body.className = 't-trail';
</script>
<script src="composants/palmares.js?v=__VERSION__"></script>
