<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>
  // Masquée jusqu'à ce qu'elle soit prête. Déjà dans le site (en-tête gardé pour la visite) : seul le contenu attend,
  // l'en-tête et le menu s'affichent aussitôt, sans page blanche entre deux pages.
  (function () { var c = null; try { c = sessionStorage.getItem('mrt-entete'); } catch (e) {} document.documentElement.classList.add(c ? 'mrt-attente-contenu' : 'mrt-attente'); })();
</script>
<title>Palmarès · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<link rel="stylesheet" href="composants/palmares.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course.css?v=__VERSION__">
<link rel="stylesheet" href="composants/modale-course.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course-v2.css?v=__VERSION__">
<style>
  .pv2-card { padding: 1rem; }
  .pv2 .table-scroll { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>
<main>
  <div id="palmares" class="pv2"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/essai.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script src="composants/palmares.js?v=__VERSION__"></script>
<script src="composants/fiche-course.js?v=__VERSION__"></script>
<script src="composants/fiche-course-v2.js?v=__VERSION__"></script>
<script>
  // Les courses courues de l'utilisateur connecté, lues dans la base.
  const hms = s => (s == null ? null : Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'));
  const ms = s => (s == null ? null : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'));
  const num = v => (v == null ? null : Number(v));
  const versPalmares = courses => courses.filter(c => c.etat === 'courue').map(c => ({
    id: c.id, date: c.date, course: mrtNomCourse(c), type: c.typeLibelle, sub: c.formatLibelle,
    dist: num(c.distance), dplus: c.dplus, time: hms(c.temps), dnf: c.dnf, pace: ms(c.allure), speed: num(c.vitesse),
    rank: c.place, rankTotal: c.effectif, rankCat: c.place_categorie, rankCatTotal: c.effectif_categorie,
    rankSex: c.place_sexe, rankSexTotal: c.effectif_sexe,
    wDist: num(c.montre_distance), wDplus: c.montre_dplus, wTime: hms(c.montre_temps), wPace: ms(c.montre_allure),
    wSpeed: num(c.montre_vitesse), hr: c.fc_moyenne
  }));
  mrtPage({ courant: 'palmares.html' }).then(async page => {
    let courses = page.courses;
    const references = await mrtReferences();
    // Après un enregistrement ou une suppression : relire et redessiner.
    const apres = async () => { courses = await page.relire(); tableau.setRaces(versPalmares(courses)); };
    const ouvrir = id => mrtFicheCourse({ course: courses.find(c => c.id === id) || null, references, apres });
    const profil = page.lectureSeule ? page.proprietaire : page.session.profil;
    const tableau = renderPalmares(document.getElementById('palmares'), {
      feminin: !!(profil && profil.sexe === 'femme'),
      editable: !page.lectureSeule,
      onAdd: () => ouvrir(null),
      onEdit: ouvrir,
      races: versPalmares(courses)
    });
  });
</script>
</body>
</html>
