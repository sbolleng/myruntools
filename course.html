<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>document.documentElement.classList.add('mrt-attente');</script>
<title>Course · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<link rel="stylesheet" href="composants/objectif.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course.css?v=__VERSION__">
</head>
<body>
<main>
  <div id="course"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script src="composants/objectif.js?v=__VERSION__"></script>
<script src="composants/fiche-course.js?v=__VERSION__"></script>
<script>
  // Une course de la feuille de route, désignée par ?id= ; l'onglet Objectif reste en avant.
  mrtPage({ courant: 'objectif.html', compact: true }).then(page => {
    let courses = page.courses;
    const el = document.getElementById('course');
    const id = new URLSearchParams(location.search).get('id');
    // Après un enregistrement : relire et redessiner. Course supprimée, courue ou sortie de la feuille de route : retour à celle-ci.
    const apres = async () => {
      courses = await page.relire();
      if (!dessiner()) location.href = 'objectif.html';
    };
    const edition = mrtEdition(page, () => courses, apres);
    const dessiner = () => {
      const c = renderPageCourse(el, courses, id, edition);
      if (c) document.title = mrtNomCourse(c) + ' · MyRunTools';
      return c;
    };
    dessiner();
  });
</script>
</body>
</html>
