<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>
  // Masquée jusqu'à ce qu'elle soit prête. Déjà dans le site (en-tête gardé pour la visite) : seul le contenu attend,
  // l'en-tête et le menu s'affichent aussitôt, sans page blanche entre deux pages.
  (function () { var c = null; try { c = sessionStorage.getItem('mrt-entete'); } catch (e) {} document.documentElement.classList.add(c ? 'mrt-attente-contenu' : 'mrt-attente'); })();
</script>
<title>Course · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<link rel="stylesheet" href="composants/objectif.css?v=__VERSION__">
<link rel="stylesheet" href="composants/preparation.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course.css?v=__VERSION__">
</head>
<body>
<main>
  <div id="course"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script src="composants/preparation.js?v=__VERSION__"></script>
<script src="composants/objectif.js?v=__VERSION__"></script>
<script src="composants/fiche-course.js?v=__VERSION__"></script>
<script>
  // Une course de la feuille de route, désignée par ?id= ; l'onglet Objectif reste en avant.
  mrtPage({ courant: 'objectif.html', sansEnTete: true, plan: true }).then(page => {
    // Courses, séances et phases modifiées : la rubrique Préparation a besoin des trois.
    const ctx = { courses: page.courses, seances: page.plan.seances, semaines: page.plan.semaines, lectureSeule: page.lectureSeule };
    ctx.relire = async () => {
      const [courses, plan] = await Promise.all([page.relire(), page.relirePlan()]);
      return { courses, seances: plan.seances, semaines: plan.semaines };
    };
    const el = document.getElementById('course');
    const id = new URLSearchParams(location.search).get('id');
    // Après un enregistrement : relire et redessiner. Course supprimée, courue ou sortie de la feuille de route : retour à celle-ci.
    const apres = async () => {
      Object.assign(ctx, await ctx.relire());
      if (!dessiner()) location.href = 'objectif.html';
    };
    ctx.actualiser = apres;
    const edition = mrtEdition(page, () => ctx.courses, apres);
    const dessiner = () => {
      const c = renderPageCourse(el, ctx.courses, id, edition, ctx);
      if (c) document.title = mrtNomCourse(c) + ' · MyRunTools';
      return c;
    };
    dessiner();
  });
</script>
</body>
</html>
