<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>
  // Masquée jusqu'à ce qu'elle soit prête (voir objectif.html).
  (function () { var c = null, t = null, h = document.documentElement; try { c = sessionStorage.getItem('mrt-entete'); t = localStorage.getItem('mrt-theme'); } catch (e) {}
    if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'noir-orange' : 'blanc-orange';
    if (t) h.classList.add('t-' + t);
    h.classList.add(c ? 'mrt-attente-contenu' : 'mrt-attente'); })();
</script>
<title>Courses à surveiller · MyRunTools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<link rel="stylesheet" href="composants/objectif.css?v=__VERSION__">
<link rel="stylesheet" href="composants/courses.css?v=__VERSION__">
<link rel="stylesheet" href="composants/trace.css?v=__VERSION__">
<link rel="stylesheet" href="composants/preparation.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course.css?v=__VERSION__">
<link rel="stylesheet" href="composants/modale-course.css?v=__VERSION__">
</head>
<body>
<main>
  <div id="courses"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script src="composants/preparation.js?v=__VERSION__"></script>
<script src="composants/trace.js?v=__VERSION__"></script>
<script src="composants/graphique.js?v=__VERSION__"></script>
<script src="composants/objectif.js?v=__VERSION__"></script>
<script src="composants/courses.js?v=__VERSION__"></script>
<script src="composants/fiche-course.js?v=__VERSION__"></script>
<script src="composants/modale-course.js?v=__VERSION__"></script>
<script>
  // Toutes les courses de l'utilisateur connecté (ou du site partagé), lues dans la base. Vue de départ : À surveiller ;
  // l'adresse peut en demander une autre (?vue=courue, venir ou tout).
  mrtPage({ courant: 'courses-a-surveiller.html' }).then(page => {
    let courses = page.courses;
    const el = document.getElementById('courses');
    const demandee = new URLSearchParams(location.search).get('vue');
    const etat = { vue: ['surveiller', 'courue', 'venir', 'tout'].includes(demandee) ? demandee : 'surveiller', tri: 'date', annee: null };
    // Après un enregistrement ou une suppression : relire et redessiner (en-tête compris).
    const apres = async () => { courses = await page.relire(); dessiner(); };
    const edition = mrtEdition(page, () => courses, apres);
    const dessiner = () => renderCourses(el, courses, edition, etat);
    dessiner();
    // La page d'une course s'ouvre en modale, par-dessus la liste.
    mrtModaleCourse(page, { courses: () => courses, surMaj: liste => { courses = liste; dessiner(); } });
  });
</script>
</body>
</html>
