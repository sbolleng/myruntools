<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>document.documentElement.classList.add('mrt-attente');</script>
<title>Préférences · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<style>
  /* Réglages : spécification docs/module-preferences-specification.md ; tailles : docs/design.md § 3. */
  .card h2 { margin-bottom: 0.7rem; font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
  .card b { font-weight: 600; }
  .pref-intro { margin-bottom: 0.4rem; font-size: 0.8rem; color: var(--muted); }
  .pref-legende { margin: 1.1rem 0 0.4rem; font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .pref-ligne { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .pref-ligne input, .pref-select { flex: 1 1 14rem; min-width: 0; padding: 0.55rem 0.7rem; font: inherit; font-size: 0.85rem; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 6px; }
  .pref-select { width: 100%; max-width: 100%; color-scheme: dark; }
  .pref-select option { background: var(--surface); color: var(--text); }
  .pref-ligne input:focus, .pref-select:focus { outline: none; border-color: var(--accent); }
  .pref-btn { padding: 0.5rem 1rem; font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 20px; cursor: pointer; }
  .pref-btn:hover { color: var(--bg); background: var(--accent); }
  .pref-liste { list-style: none; }
  .pref-liste li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.45rem 0; border-bottom: 1px solid var(--border); }
  .pref-liste li:last-child { border-bottom: none; }
  .pref-lien { background: none; border: none; padding: 0; font: inherit; font-size: 0.75rem; color: var(--accent); text-decoration: underline; cursor: pointer; }
  .pref-msg { min-height: 1.4em; margin-top: 0.4rem; font-size: 0.75rem; color: var(--muted); }
  .pref-msg.erreur { color: var(--red); }
  .pref-vide { font-size: 0.8rem; color: var(--muted); }
  /* Thème : un choix par ligne, avec ses deux couleurs. */
  .pref-themes { display: grid; gap: 0.4rem; }
  .pref-theme { display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .pref-theme:has(input:checked) { border-color: var(--accent); }
  .pref-theme input { accent-color: var(--accent); margin: 0; }
  .pref-apercu { display: inline-flex; flex: none; }
  .pref-apercu span { width: 1rem; height: 1rem; border-radius: 50%; border: 1px solid var(--border); }
  .pref-apercu span + span { margin-left: -0.3rem; }
  /* Menu : case, nom, flèches. */
  .pref-modules li { gap: 0.6rem; }
  .pref-modules label { flex: 1; display: flex; align-items: center; gap: 0.6rem; cursor: pointer; }
  .pref-modules input { accent-color: var(--accent); margin: 0; }
  .pref-modules .bientot { opacity: 0.45; }
  .pref-fleches { display: flex; gap: 0.3rem; }
  .pref-rond { display: inline-flex; align-items: center; justify-content: center; width: 1.8rem; height: 1.8rem; padding: 0; font: inherit; font-size: 0.75rem; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 50%; cursor: pointer; }
  .pref-rond:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .pref-rond:disabled { opacity: 0.3; cursor: default; }
  .pref-defaut { margin-top: 0.6rem; }
</style>
</head>
<body>
<main>
  <div class="card" id="bloc-compte">
    <h2>Compte</h2>
    <p id="compte" class="muted">Lecture…</p>
  </div>
  <div class="card" id="bloc-cap">
    <h2>Cap</h2>
    <div class="pref-corps"></div>
    <p class="pref-msg" aria-live="polite"></p>
  </div>
  <div class="card" id="bloc-theme">
    <h2>Thème</h2>
    <div class="pref-corps"></div>
    <p class="pref-msg" aria-live="polite"></p>
  </div>
  <div class="card" id="bloc-menu">
    <h2>Menu</h2>
    <div class="pref-corps"></div>
    <p class="pref-msg" aria-live="polite"></p>
  </div>
  <div class="card" id="partage">
    <h2>Partage</h2>
    <p class="pref-intro">Le partage donne à un autre compte un accès en lecture seule à ton site : courses et réglages. Les données de santé ne sont jamais partagées. L'accès peut être retiré à tout moment.</p>
    <div class="pref-legende">Partager mon site avec</div>
    <form class="pref-ligne" id="form-partage">
      <input type="email" id="partage-email" required autocomplete="off" placeholder="adresse e-mail de son compte" aria-label="Adresse e-mail">
      <button class="pref-btn" type="submit">Partager</button>
    </form>
    <p class="pref-msg" id="partage-msg" aria-live="polite"></p>
    <div class="pref-legende">Je partage avec</div>
    <ul class="pref-liste" id="mes-partages"></ul>
    <div class="pref-legende">Sites partagés avec moi</div>
    <ul class="pref-liste" id="partages-avec-moi"></ul>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script>
  const db = () => mrtSupabase;
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const THEMES = [
    { id: 'bleu-orange', nom: 'Bleu et orange' },
    { id: 'vert-rose', nom: 'Vert et rose' },
    { id: 'violet-turquoise', nom: 'Violet et turquoise' }
  ];
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  // « 15 nov. 2026 », ou « août 2029 » si le jour n'est pas connu.
  const dateCourte = c => {
    const p = c.date.split('-').map(Number);
    return (c.date_approx ? '' : (p[2] === 1 ? '1er' : p[2]) + ' ') + MOIS[p[1] - 1] + ' ' + p[0];
  };

  mrtPage({ courant: 'preferences.html' }).then(page => {
    afficherPartages(page);
    const blocs = ['bloc-theme', 'bloc-menu', 'bloc-cap'].map(id => document.getElementById(id));
    if (page.lectureSeule) {
      blocs.forEach(b => { b.querySelector('.pref-corps').innerHTML = '<p class="pref-vide">Reviens à ton site pour modifier tes réglages.</p>'; });
      return;
    }
    const prefs = Object.assign({}, page.session.preferences);

    // Enregistre un réglage ; l'en-tête et le menu suivent. En cas d'échec, annuler() remet le bloc en l'état.
    let attente = {};
    async function enregistrer(bloc, champs, annuler) {
      const msg = bloc.querySelector('.pref-msg');
      clearTimeout(attente[bloc.id]);
      msg.className = 'pref-msg';
      msg.textContent = 'Enregistrement…';
      const { error } = await db().from('preferences').upsert(Object.assign({ utilisateur: page.session.id }, champs));
      if (error) {
        msg.className = 'pref-msg erreur';
        msg.textContent = 'Enregistrement impossible pour l\'instant.';
        annuler();
        return;
      }
      Object.assign(prefs, champs);
      page.redessiner(prefs);
      msg.textContent = 'Enregistré.';
      attente[bloc.id] = setTimeout(() => { msg.textContent = ''; }, 3000);
    }

    // ----- Thème
    const blocTheme = blocs[0], themeActuel = () => (THEMES.find(t => t.id === prefs.theme) || THEMES[0]).id;
    blocTheme.querySelector('.pref-corps').innerHTML = '<div class="pref-themes" role="radiogroup" aria-label="Thème">' + THEMES.map(t =>
      '<label class="pref-theme"><input type="radio" name="theme" value="' + t.id + '"' + (t.id === themeActuel() ? ' checked' : '') + '>' +
      '<span class="pref-apercu t-' + t.id + '"><span style="background:var(--bg)"></span><span style="background:var(--accent)"></span></span>' +
      '<span>' + esc(t.nom) + '</span></label>').join('') + '</div>';
    blocTheme.addEventListener('change', e => {
      const avant = themeActuel();
      enregistrer(blocTheme, { theme: e.target.value }, () => { blocTheme.querySelector('input[value="' + avant + '"]').checked = true; });
    });

    // ----- Menu : modules affichés dans l'ordre choisi, puis les autres.
    const blocMenu = blocs[1];
    const parDefaut = () => mrtModules.map(m => ({ nom: m.nom, affiche: true }));
    const depuisPrefs = () => {
      if (!prefs.modules || !prefs.modules.length) return parDefaut();
      const choisis = prefs.modules.filter(n => mrtModules.some(m => m.nom === n));
      return choisis.map(nom => ({ nom, affiche: true }))
        .concat(mrtModules.filter(m => !choisis.includes(m.nom)).map(m => ({ nom: m.nom, affiche: false })));
    };
    let liste = depuisPrefs();
    function dessinerMenu() {
      const nbAffiches = liste.filter(m => m.affiche).length;
      blocMenu.querySelector('.pref-corps').innerHTML = '<ul class="pref-liste pref-modules">' + liste.map((m, i) => {
        const construit = mrtModules.find(x => x.nom === m.nom).page;
        const seul = m.affiche && nbAffiches === 1;
        return '<li><label' + (construit ? '' : ' class="bientot" title="Bientôt"') + '><input type="checkbox" data-i="' + i + '"' + (m.affiche ? ' checked' : '') + (seul ? ' disabled title="Au moins un module reste affiché"' : '') + '>' + esc(m.nom) + '</label>' +
          '<span class="pref-fleches"><button type="button" class="pref-rond" data-monter="' + i + '" aria-label="Monter ' + esc(m.nom) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button type="button" class="pref-rond" data-descendre="' + i + '" aria-label="Descendre ' + esc(m.nom) + '"' + (i === liste.length - 1 ? ' disabled' : '') + '>↓</button></span></li>';
      }).join('') + '</ul><button type="button" class="pref-lien pref-defaut">Rétablir l\'ordre par défaut</button>';
    }
    function changerMenu(nouvelle, valeur) {
      const avant = liste;
      liste = nouvelle;
      dessinerMenu();
      enregistrer(blocMenu, { modules: valeur !== undefined ? valeur : liste.filter(m => m.affiche).map(m => m.nom) }, () => { liste = avant; dessinerMenu(); });
    }
    dessinerMenu();
    blocMenu.addEventListener('change', e => {
      const i = Number(e.target.dataset.i);
      changerMenu(liste.map((m, j) => (j === i ? { nom: m.nom, affiche: e.target.checked } : m)));
    });
    blocMenu.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.classList.contains('pref-defaut')) return changerMenu(parDefaut(), null);
      const i = Number(b.dataset.monter != null ? b.dataset.monter : b.dataset.descendre), j = b.dataset.monter != null ? i - 1 : i + 1;
      const nouvelle = liste.slice();
      [nouvelle[i], nouvelle[j]] = [nouvelle[j], nouvelle[i]];
      changerMenu(nouvelle);
    });

    // ----- Cap : course du titre de l'en-tête, par défaut la plus lointaine.
    const blocCap = blocs[2], candidates = mrtCoursesCap(page.courses);
    if (!candidates.length) {
      blocCap.querySelector('.pref-corps').innerHTML = '<p class="pref-vide">Aucune course à venir.</p>';
    } else {
      const plusLointaine = candidates[candidates.length - 1];
      const capActuel = () => (candidates.some(c => c.id === prefs.course_cap) ? prefs.course_cap : '');
      blocCap.querySelector('.pref-corps').innerHTML = '<p class="pref-intro">Course affichée dans le titre de l\'en-tête.</p>' +
        '<select class="pref-select" aria-label="Cap"><option value="">Par défaut : la plus lointaine (' + esc(mrtNomCourse(plusLointaine)) + ')</option>' +
        candidates.map(c => '<option value="' + esc(c.id) + '">' + esc(mrtNomCourse(c)) + ' · ' + esc(dateCourte(c)) + '</option>').join('') + '</select>';
      const select = blocCap.querySelector('select');
      select.value = capActuel();
      select.addEventListener('change', () => {
        const avant = capActuel();
        enregistrer(blocCap, { course_cap: select.value || null }, () => { select.value = avant; });
      });
    }
  });

  const nomComplet = p => [p.prenom, p.nom].filter(Boolean).join(' ');
  async function afficherPartages(page) {
    const [mes, avec] = await Promise.all([db().rpc('mes_partages'), db().rpc('partages_avec_moi')]);
    const ul1 = document.getElementById('mes-partages'), ul2 = document.getElementById('partages-avec-moi');
    ul1.innerHTML = (mes.data || []).length ? '' : '<li class="pref-vide">Personne pour l\'instant.</li>';
    (mes.data || []).forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><button class="pref-lien" type="button">Retirer</button>';
      li.querySelector('span').textContent = nomComplet(p);
      li.querySelector('button').addEventListener('click', async () => {
        await db().from('partages').delete().eq('invite', p.id);
        afficherPartages(page);
      });
      ul1.appendChild(li);
    });
    ul2.innerHTML = (avec.data || []).length ? '' : '<li class="pref-vide">Aucun site partagé avec toi.</li>';
    (avec.data || []).forEach(p => {
      const li = document.createElement('li');
      const regarde = page && page.proprietaire && page.proprietaire.id === p.id;
      li.innerHTML = '<span></span><button class="pref-lien" type="button"></button>';
      li.querySelector('span').textContent = nomComplet(p);
      const b = li.querySelector('button');
      b.textContent = regarde ? 'Revenir à mon site' : 'Voir son site';
      b.addEventListener('click', () => (regarde ? mrtRevenir() : mrtVoirSite(p.id)));
      ul2.appendChild(li);
    });
  }
  document.getElementById('form-partage').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = document.getElementById('partage-msg'), champ = document.getElementById('partage-email');
    msg.className = 'pref-msg';
    msg.textContent = 'Partage en cours…';
    const { error } = await db().rpc('partager', { adresse: champ.value });
    if (error) {
      msg.className = 'pref-msg erreur';
      msg.textContent = /Aucun compte/.test(error.message) ? 'Aucun compte avec cette adresse.'
        : /propre compte/.test(error.message) ? 'C\'est ton propre compte.' : 'Partage impossible pour l\'instant.';
      return;
    }
    msg.textContent = 'Site partagé.';
    champ.value = '';
    afficherPartages(null);
  });
  const compte = document.getElementById('compte');
  mrtSession().then(s => {
    if (!s) {
      compte.innerHTML = 'Non connecté. <a href="connexion.html' + location.search + '">Se connecter</a>';
      return;
    }
    const p = s.profil || {};
    compte.innerHTML = 'Connecté : <b>' + esc([p.prenom, p.nom].filter(Boolean).join(' ') || 'profil à créer') + '</b> · ' + esc(s.email) +
      '<br><a href="#" id="deconnexion">Se déconnecter</a>';
    document.getElementById('deconnexion').addEventListener('click', async e => {
      e.preventDefault();
      await mrtDeconnecter();
      location.reload();
    });
  });
</script>
</body>
</html>
