<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Maquette Objectif · feuille de route</title>
<link rel="stylesheet" href="../../composants/en-tete.css">
<link rel="stylesheet" href="objectif.css">
</head>
<body>
<main>
  <p class="mq-note" id="note"></p>
  <div class="mq-place" style="margin-bottom:1.5rem"><b>Graphique de difficulté</b>Place réservée, lot suivant.</div>
  <h2 class="ob-titre-bloc">Feuille de route</h2>
  <div id="fr"></div>
  <div class="mq-dossards" id="dossards"></div>
</main>
<script src="../../composants/en-tete.js"></script>
<script src="objectif-donnees.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const t = q.get('t') ? '&t=' + q.get('t') : '';
  MQ.entete();
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const page = c => 'objectif-course.html?c=' + c.id + t;
  const ext = c => c.lien ? '<a class="ob-ext" href="' + c.lien + '" target="_blank" rel="noopener" title="Site officiel" aria-label="Site officiel">↗</a>' : '';
  const cls = c => c.role === 'objectif' ? 'is-obj' : c.role === 'objectif_intermediaire' ? 'is-cle' : '';
  const chiffres = c => (c.distance != null ? '<span class="ob-mono">' + MQ.nf.format(c.distance) + ' km</span>' : '') +
    (c.dplus != null ? ' · <span class="ob-mono">' + MQ.nf.format(c.dplus) + ' m D+</span>' : '');
  const role = c => (c.statut === 'option' ? '<span class="ob-role is-opt">Option</span>' : '') +
    '<span class="ob-role ' + cls(c) + '">' + MQ.ROLES[c.role] + '</span>';
  const objectif = c => c.objectif ? '<div class="ob-stat"><span class="ob-stat-val">' + esc(c.objectif) + '</span><span class="ob-stat-label">Objectif</span></div>' : '';

  // Une carte par étape, le long d'un trait ; un groupe d'options fait une seule carte.
  const et = MQ.etapes();
  document.getElementById('fr').innerHTML = et.map((e, i) => {
    const suiv = et[i + 1];
    const opt = e.groupe || e.course.statut === 'option';
    const suiteOpt = suiv && (suiv.groupe || suiv.course.statut === 'option');
    const k = ['fr-et', opt ? 'is-opt' : '', suiteOpt ? 'suite-opt' : '', e.course ? cls(e.course) : ''].join(' ');
    let carte;
    if (e.groupe) {
      carte = '<div class="fr-carte fr-groupe"><div class="fr-tete"><div class="fr-haut"><span class="ob-role is-opt">À choisir</span>' +
        '<span class="ob-date">' + e.candidates.length + ' candidates</span></div><div class="fr-groupe-titre">' + esc(e.groupe) + '</div></div>' +
        '<div class="fr-cands">' + e.candidates.map(c => '<div class="fr-cand"><div><span class="ob-date">' + MQ.dateCourte(c) + '</span>' +
          '<div class="fr-nom"><a href="' + page(c) + '">' + esc(MQ.nom(c)) + '</a>' + ext(c) + '</div>' +
          '<div class="fr-info">' + esc(c.lieu) + ' · ' + chiffres(c) + '</div></div>' +
          '<div class="fr-cote">' + MQ.dossardHtml(c) + MQ.compteurLigneHtml(c) + '</div></div>').join('') + '</div></div>';
    } else {
      const c = e.course;
      carte = '<div class="fr-carte"><div class="fr-tete"><div class="fr-haut">' + role(c) + '<span class="ob-date">' + MQ.dateCourte(c) + '</span></div>' +
        '<div class="fr-nom"><a href="' + page(c) + '">' + esc(MQ.nom(c)) + '</a>' + ext(c) + '</div>' +
        '<div class="fr-info">' + esc(c.lieu) + ' · ' + esc(c.format) + ' · ' + chiffres(c) + '</div></div>' +
        '<div class="fr-cote">' + objectif(c) + MQ.dossardHtml(c) + '</div>' + MQ.compteurHtml(c) + '</div>';
    }
    return '<div class="' + k + '"><div class="fr-rail"><span class="fr-pt"></span></div>' + carte + '</div>';
  }).join('') +
  '<div class="fr-legende"><span><i></i>Confirmée</span><span><i class="cle"></i>Objectif intermédiaire</span><span><i class="obj"></i>Course objectif</span><span><i class="opt"></i>Option</span></div>';

  // Planche : les quatre états du dossard.
  document.getElementById('dossards').innerHTML = '<p class="ob-titre-bloc">Dossard · les quatre états</p>' +
    [{ inscrit: true, dossard: '412' }, { inscrit: false, ouverture: '2026-09-01', inscription: '#' }, { inscrit: false, ouverture: '2027-01-10' }, { inscrit: false }]
      .map(MQ.dossardHtml).join('');
  MQ.lancerCompteurs();

  const th = (n, l) => '<a href="?t=' + n + '">' + l + '</a>';
  document.getElementById('note').innerHTML = 'Maquette, données fictives, date de départ figée au 20 octobre 2026. Thèmes : ' +
    th('bleu-orange', 'bleu et orange') + ', ' + th('vert-rose', 'vert et rose') + ', ' + th('violet-turquoise', 'violet et turquoise') +
    ' · <a href="objectif-mobile.html">vue téléphone</a>. Touche une étape pour ouvrir la page de la course.';
</script>
</body>
</html>
