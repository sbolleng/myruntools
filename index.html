<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<script>
  // Masquée jusqu'à ce qu'elle soit prête. Déjà dans le site (en-tête gardé pour la visite) : seul le contenu attend,
  // l'en-tête et le menu s'affichent aussitôt, sans page blanche entre deux pages. Le thème de la dernière visite est posé
  // tout de suite (« auto » : selon le réglage de l'appareil) : pas d'éclair d'un autre fond avant la lecture des préférences.
  (function () { var c = null, t = null, h = document.documentElement; try { c = sessionStorage.getItem('mrt-entete'); t = localStorage.getItem('mrt-theme'); } catch (e) {}
    if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'noir-orange' : 'blanc-orange';
    if (t) h.classList.add('t-' + t);
    h.classList.add(c ? 'mrt-attente-contenu' : 'mrt-attente'); })();
</script>
<title>MyRunTools</title>
<!-- Polices : liées ici (et non importées par la feuille de style), pour être chargées en même temps qu'elle. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<link rel="stylesheet" href="composants/objectif.css?v=__VERSION__">
<link rel="stylesheet" href="composants/trace.css?v=__VERSION__">
<link rel="stylesheet" href="composants/preparation.css?v=__VERSION__">
<link rel="stylesheet" href="composants/fiche-course.css?v=__VERSION__">
<link rel="stylesheet" href="composants/modale-course.css?v=__VERSION__">
<link rel="stylesheet" href="composants/nutrition.css?v=__VERSION__">
<link rel="stylesheet" href="composants/profil.css?v=__VERSION__">
<link rel="stylesheet" href="composants/accueil.css?v=__VERSION__">
</head>
<body>
<main>
  <div id="accueil"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script src="composants/donnees.js?v=__VERSION__"></script>
<script src="composants/preparation.js?v=__VERSION__"></script>
<script src="composants/trace.js?v=__VERSION__"></script>
<script src="composants/objectif.js?v=__VERSION__"></script>
<script src="composants/fiche-course.js?v=__VERSION__"></script>
<script src="composants/modale-course.js?v=__VERSION__"></script>
<script src="composants/besoin.js?v=__VERSION__"></script>
<script src="composants/nutrition.js?v=__VERSION__"></script>
<script src="composants/profil.js?v=__VERSION__"></script>
<script src="composants/accueil.js?v=__VERSION__"></script>
<script>
  mrtPage({ courant: 'index.html' }).then(page => {
    const el = document.getElementById('accueil');
    let courses = page.courses;
    // Bloc Nutrition : le profil de l'utilisateur connecté ; rien sur un site partagé.
    const nutrition = { profil: page.session.profil || {}, id: page.session.id, lectureSeule: page.lectureSeule, seances: [] };
    // « Ajouter au menu » (bloc Pour aller plus loin) : enregistre la liste des modules, redessine le menu puis la page.
    nutrition.ajouterModule = async nom => {
      const prefs = page.preferences(), modules = mrtModulesAvec(prefs, nom);
      const { error } = await mrtSupabase.from('preferences').upsert({ utilisateur: page.session.id, modules });
      if (error) { console.warn(error); renderAccueil(el, courses, prefs, nutrition); return; }
      Object.assign(prefs, { modules });
      page.redessiner(prefs);
      renderAccueil(el, courses, prefs, nutrition);
    };
    const dessiner = () => renderAccueil(el, courses, page.preferences(), nutrition);
    // Découvrir MyRunTools : la case « Au menu » ajoute ou retire le module ; « J'ai compris » range le bloc (Préférences : « Revoir la découverte »).
    const garderPrefs = async champs => {
      const prefs = page.preferences();
      const { error } = await mrtSupabase.from('preferences').upsert(Object.assign({ utilisateur: page.session.id }, champs));
      if (error) console.warn(error); else { Object.assign(prefs, champs); page.redessiner(prefs); }
      dessiner();
    };
    nutrition.basculerModule = (nom, on) => garderPrefs({ modules: on ? mrtModulesAvec(page.preferences(), nom) : mrtModulesSans(page.preferences(), nom) });
    nutrition.decouverteVue = () => garderPrefs({ decouverte_vue: true });
    // Premiers pas : le profil express (sexe, naissance, poids, taille, repère d'allure) et la fiche d'ajout d'une course.
    const etatProfil = { id: page.session.id, mesures: nutrition.profil };
    nutrition.ouvrirProfil = () => mrtProfil.feuille({ etat: etatProfil, suite: mrtProfil.EXPRESS, surMaj: e => { nutrition.profil = e.mesures; nutrition.entrainement = e.entrainement || null; dessiner(); } });
    const edition = mrtEdition(page, () => courses, async () => { courses = await page.relire(); dessiner(); });
    nutrition.ajouterCourse = () => edition && edition.ajouter();
    // Le profil d'entraînement (repère d'allure) est lu avant le premier affichage : les Premiers pas ne surgissent pas après coup.
    if (!page.lectureSeule) mrtAttendre(mrtSupabase.from('profil_entrainement').select('*').then(({ data, error }) => {
      if (error) console.warn(error);
      nutrition.entrainement = etatProfil.entrainement = (data && data[0]) || null;
      dessiner();
    }));
    dessiner();
    // Les séances du jour arrivent ensuite : le bloc « Aujourd'hui » se redessine avec elles.
    if (!page.lectureSeule) page.relirePlan().then(p => { nutrition.seances = p.seances || []; renderAccueil(el, courses, page.preferences(), nutrition); }).catch(e => console.warn('Séances illisibles', e));
    // La page d'une course s'ouvre en modale, par-dessus l'Accueil.
    mrtModaleCourse(page, { courses: () => courses, surMaj: liste => { courses = liste; renderAccueil(el, courses, page.preferences(), nutrition); } });
  });
</script>
</body>
</html>
