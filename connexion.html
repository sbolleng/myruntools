<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<title>Se connecter · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<style>
  .connexion { max-width: 26rem; margin: 2rem auto; }
  .connexion h2 { margin-bottom: 0.4rem; }
  .connexion p { font-size: 0.85rem; }
  .connexion label { display: block; margin: 1.2rem 0 0.4rem; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .connexion input { width: 100%; padding: 0.7rem 0.8rem; font: inherit; font-size: 1rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .connexion input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .connexion button { margin-top: 1rem; width: 100%; padding: 0.75rem; font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: none; border-radius: 6px; cursor: pointer; }
  .connexion button:disabled { opacity: 0.6; cursor: default; }
  .connexion .message { margin-top: 1rem; }
  .connexion .erreur { color: var(--red); }
</style>
</head>
<body>
<main>
  <div class="card connexion">
    <h2>Se connecter</h2>
    <p class="muted">Saisis ton adresse e-mail : tu recevras un lien de connexion, sans mot de passe.</p>
    <form id="form-connexion">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" required autocomplete="email" inputmode="email">
      <button type="submit">Recevoir le lien</button>
    </form>
    <p class="message" id="message" aria-live="polite"></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="donnees/demo.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script>
  renderEnTete(Object.assign({}, MRT_PROFIL, { courant: 'connexion.html' }));
  const form = document.getElementById('form-connexion'), msg = document.getElementById('message');
  // Déjà connecté (retour du lien magique) : direction l'accueil.
  mrtSession().then(s => { if (s) location.replace('index.html' + location.search); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    msg.className = 'message';
    msg.textContent = 'Envoi en cours…';
    try {
      await mrtEnvoyerLien(document.getElementById('email').value.trim(), location.href.split('#')[0]);
      msg.textContent = 'C\'est parti : ouvre l\'e-mail reçu et touche le lien. Il peut mettre une minute à arriver.';
    } catch (err) {
      msg.className = 'message erreur';
      msg.textContent = /rate|limit/i.test(err.message || '')
        ? 'Trop de demandes pour l\'instant : réessaie dans quelques minutes.'
        : 'Lien non envoyé : vérifie l\'adresse. Seuls les comptes créés par l\'administrateur peuvent se connecter.';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
