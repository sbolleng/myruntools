<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="site-version" content="__VERSION__">
<title>Se connecter · MyRunTools</title>
<link rel="stylesheet" href="composants/en-tete.css?v=__VERSION__">
<style>
  /* Page d'accueil des visiteurs non connectés : sobre, sans en-tête ni menu. */
  body { display: grid; place-items: center; padding: 1.5rem; }
  .connexion { width: 100%; max-width: 22rem; text-align: center; }
  .connexion h1 { font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .connexion .accroche { font-size: 0.85rem; color: var(--muted); margin-bottom: 2.2rem; }
  .connexion form { text-align: left; }
  .connexion label { display: block; margin-bottom: 0.4rem; font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .connexion input {
    width: 100%;
    padding: 0.55rem 0.7rem;
    font: inherit;
    font-size: 0.85rem;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .connexion input:focus { outline: none; border-color: var(--accent); }
  .connexion button { margin-top: 0.8rem; width: 100%; padding: 0.6rem; }
  .connexion .message { min-height: 2.6em; margin-top: 1rem; font-size: 0.75rem; color: var(--muted); text-align: center; }
  .connexion .erreur { color: var(--red); }
</style>
</head>
<body>
<main class="connexion">
  <h1>MyRunTools</h1>
  <p class="accroche">La boîte à outils du coureur</p>
  <form id="form-connexion">
    <label for="email">Adresse e-mail</label>
    <input type="email" id="email" required autocomplete="email" inputmode="email" placeholder="toi@exemple.fr">
    <button type="submit" class="mrt-btn is-principal">Recevoir le lien de connexion</button>
  </form>
  <p class="message" id="message" aria-live="polite">Pas de mot de passe : un lien arrive par e-mail.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="donnees/supabase.js?v=__VERSION__"></script>
<script src="composants/en-tete.js?v=__VERSION__"></script>
<script src="composants/session.js?v=__VERSION__"></script>
<script>
  // Pas d'en-tête ici : thème par défaut, le visiteur n'est pas encore connu.
  const form = document.getElementById('form-connexion'), msg = document.getElementById('message');
  // Déjà connecté (retour du lien magique) : direction l'accueil.
  mrtSession().then(s => { if (s) location.replace('index.html' + location.search); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    msg.className = 'message';
    msg.textContent = 'Envoi en cours…';
    try {
      await mrtEnvoyerLien(document.getElementById('email').value.trim(), location.href.split('#')[0]);
      msg.textContent = 'Lien envoyé : ouvre l\'e-mail et touche le lien. Il peut mettre une minute à arriver.';
    } catch (err) {
      msg.className = 'message erreur';
      msg.textContent = /rate|limit/i.test(err.message || '')
        ? 'Trop de demandes pour l\'instant : réessaie dans quelques minutes.'
        : 'Lien non envoyé : vérifie l\'adresse. Seuls les comptes existants peuvent se connecter.';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
